[project]
name = "aitar-kotha"
version = "0.1.0"
description = "Aitar Kotha (আইতাৰ কথা): an Assamese plant field guide that talks like your grandmother, fine-tuned with Tinker and run on open models."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Jeman Kalita" }]
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "httpx>=0.27",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
train = ["tinker", "tinker-cookbook"]
dev = ["pytest>=8", "pytest-cov>=5"]

[tool.setuptools]
packages = ["aita"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
